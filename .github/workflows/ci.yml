name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_ENV: test
  DATABASE_URL: postgres://postgres:password@localhost:5432/outline_test
  REDIS_URL: redis://127.0.0.1:6379
  URL: http://localhost:3000
  NODE_OPTIONS: --max-old-space-size=8192
  SECRET_KEY: F0E5AD933D7F6FD8F4DBB3E038C501C052DC0593C686D21ACB30AE205D2F634B
  UTILS_SECRET: 123456
  SLACK_VERIFICATION_TOKEN: 123456
  SMTP_USERNAME: localhost

jobs:
  changes:
    # Blacksmith runners are only available to the outline organization, and are
    # not used for pull requests from forks so that fork-controlled code cannot
    # write to the shared sticky disks. Keep in sync with actions/install.
    runs-on: ${{ (github.repository_owner == 'outline' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    outputs:
      runner: ${{ (github.repository_owner == 'outline' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && 'blacksmith-8vcpu-ubuntu-2404' || 'ubuntu-latest' }}
      code: ${{ steps.filter.outputs.code }}
      config: ${{ steps.filter.outputs.config }}
      server: ${{ steps.filter.outputs.server }}
      app: ${{ steps.filter.outputs.app }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@4512585405083f25c027a35db413c2b3b9006d50 # v2
        id: filter
        with:
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!public/**'
              - '!shared/i18n/locales/**'
            config:
              - '.github/**'
              - 'vite.config.ts'
              - 'vitest.config.ts'
            server:
              - 'server/**'
              - 'shared/**'
              - 'plugins/**'
              - 'package.json'
              - 'yarn.lock'
            app:
              - 'app/**'
              - 'shared/**'
              - 'package.json'
              - 'yarn.lock'
            deps:
              - 'package.json'
              - 'yarn.lock'
              - '.yarnrc.yml'

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: yarn lint --quiet

  actionlint:
    needs: changes
    if: ${{ needs.changes.outputs.config == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  types:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      # The sticky-disk node_modules persists the tsc build cache, which can
      # replay stale diagnostics; always run a full check in CI.
      - run: yarn tsc --incremental false

  audit:
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: yarn npm audit --severity high --recursive --environment production

  test:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ${{ needs.changes.outputs.runner }}
    strategy:
      matrix:
        test-group: [app, shared]
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - run: yarn test:${{ matrix.test-group }}

  test-server:
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.config == 'true' }}
    runs-on: ${{ needs.changes.outputs.runner }}
    strategy:
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - uses: actions/checkout@v5
      # The runner image ships with PostgreSQL preinstalled, starting it is much
      # faster than pulling and initializing a service container.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          until pg_isready -h localhost; do sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'password';"
          sudo -u postgres createdb outline_test
      - uses: ./.github/actions/install
      - run: yarn sequelize db:migrate
      - name: Run server tests
        run: yarn test:server --maxWorkers=4 --shard=${{ matrix.shard }}/6

  bundle-size:
    needs: changes
    if: ${{ (needs.changes.outputs.app == 'true' || needs.changes.outputs.config == 'true') && github.repository == 'outline/outline' }}
    runs-on: ${{ needs.changes.outputs.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: Set environment to production
        run: echo "NODE_ENV=production" >> "$GITHUB_ENV"
      - run: yarn vite:build
      - name: Send bundle stats to RelativeCI
        if: ${{ env.RELATIVE_CI_KEY != '' }}
        env:
          RELATIVE_CI_KEY: ${{ secrets.RELATIVE_CI_KEY }}
        uses: relative-ci/agent-action@38328454d6a23942175eba485fca4fbb807b1f03 # v2
        with:
          key: ${{ secrets.RELATIVE_CI_KEY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          webpackStatsFile: ./build/app/webpack-stats.json

  # Always runs, so it can be used as the single required status check. Jobs
  # above are skipped when irrelevant to the changes, which is a pass here.
  # Audit is intentionally excluded, it reports advisories that can have no
  # fix available or affect dev only and should not block merging.
  ci:
    needs: [changes, lint, actionlint, types, test, test-server, bundle-size]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more jobs failed or were cancelled."
          exit 1
