name: Build fork image (ghcr)

# Fork-local replacement for docker.yml, which targets upstream's Blacksmith
# runners and Docker Hub namespace and cannot run here. amd64 only: the
# deployment target is an x86 LXC container.

on:
  push:
    branches:
      - "feat/standalone-databases-**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/plinsboorg/outline

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The base build unpacks node_modules twice and writes a full client
      # bundle; the runner's default free space is not enough headroom.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built into the local daemon rather than pushed: the base image is only
      # an input to the runtime stage below and is not deployed anywhere.
      - name: Build base image
        run: docker build --file Dockerfile.base --tag outline-base:local .

      - name: Build runtime image
        run: |
          SHA="$(git rev-parse --short HEAD)"
          docker build \
            --file Dockerfile \
            --build-arg BASE_IMAGE=outline-base:local \
            --tag "$IMAGE:$SHA" \
            --tag "$IMAGE:db-phase6" \
            .
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Push
        run: |
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:db-phase6"
          echo "### Pushed \`$IMAGE:$SHA\`" >> "$GITHUB_STEP_SUMMARY"
