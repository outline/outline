name = "pet-store-app"
main = "dist/server/index.mjs"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/_server/*"]

[vars]
NODE_ENV = "production"

# Secrets are NOT set in this file.
# `process.env` is not available inside a Cloudflare Worker — secrets are
# injected via `wrangler secret put <NAME>` and accessed through the
# runtime env. Production requires DATABASE_URL, EMBER_API_KEY,
# MIDTRANS_SERVER_KEY, and the key required by the selected EMAIL_PROVIDER.
# Set each secret with:
#
#   set -a; source .env; set +a
#   wrangler secret put DATABASE_URL
#   wrangler secret put EMBER_API_KEY
#   wrangler secret put MIDTRANS_SERVER_KEY
#
# Upstash is optional, but its URL and token must be configured together.
# MCP is optional unless the MCP endpoint is used.

# File uploads go through Ember (https://ember.treonstudio.com), a shared
# multi-tenant storage service - see src/infra/adapters/ember.adapter.ts.
# APP_PUBLIC_URL, EMAIL_PROVIDER, EMAIL_FROM, EMBER_BUCKET, and the public
# Midtrans client settings may be configured as non-secret Worker vars.
