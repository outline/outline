services:
  redis:
    image: redis
    ports:
      # Set REDIS_PORT in .env to run alongside another checkout.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    user: "redis:redis"
  postgres:
    image: postgres
    ports:
      # Set POSTGRES_PORT in .env to run alongside another checkout.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    user: "postgres:postgres"
