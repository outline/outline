services:
  outline:
    image: "${ECR_REGISTRY:-ecr-registry-not-configured}/outline:${IMAGE_TAG:-latest}"
    profiles: ["ecr"]
    pull_policy: always
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://user:pass@postgres:5432/outline
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - outline-data:/var/lib/outline/data

  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
    user: "redis:redis"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: outline
    user: "postgres:postgres"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d outline"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  outline-data:
  postgres-data:
